{% extends 'base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Confirmar Exclusão</h3>
                </div>
                <div class="card-body">
                    <p>Tem certeza que deseja excluir a permissão <strong>{{ permission.get_permission_type_display }}</strong> do usuário <strong>{{ permission.user.nome }}</strong>?</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Sim, excluir</button>
                        <a href="{% url 'permissions:permission_list' %}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
