{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - FCM{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="fas fa-user-tag"></i> {{ title }}
                    </h5>
                </div>
                <div class="card-body">
                    {% if user_role %}
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <strong>Editando associação:</strong> 
                        {{ user_role.user.nome }} - {{ user_role.role.get_name_display }}
                    </div>
                    {% endif %}

                    {% crispy form %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    {% if user_role %}
    // Carregar outras associações do usuário via simulação
    const userId = '{{ user_role.user.id }}';
    
    // Simular carregamento de associações
    setTimeout(() => {
        const container = document.getElementById('userRoles');
        
        // Aqui você poderia fazer uma requisição AJAX real
        // Por enquanto, vamos simular com dados estáticos
        const mockAssociations = [
            // Dados simulados - em produção viria de uma API
        ];
        
        if (mockAssociations.length > 0) {
            let html = '<div class="row">';
            
            mockAssociations.forEach(assoc => {
                html += `
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title">
                                    <span class="badge ${assoc.badge_class}">${assoc.role_name}</span>
                                </h6>
                                <p class="card-text small text-muted">
                                    Status: ${assoc.is_active ? 'Ativa' : 'Inativa'}
                                </p>
                                <small class="text-muted">
                                    Associado em ${assoc.created_at}
                                </small>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        } else {
            container.innerHTML = `
                <div class="text-center text-muted">
                    <i class="bi bi-info-circle"></i>
                    <p class="mt-2">Este usuário não possui outras associações de role.</p>
                </div>
            `;
        }
    }, 1000);
    {% endif %}
    
    // Validação em tempo real
    const userField = document.querySelector('#id_user');
    const roleField = document.querySelector('#id_role');
    
    if (userField && roleField) {
        function validateCombination() {
            const userId = userField.value;
            const roleId = roleField.value;
            
            if (userId && roleId) {
                // Aqui poderia fazer uma validação AJAX para verificar duplicatas
                // Por enquanto, a validação é feita no backend
                
                // Mostrar informações do role selecionado
                const selectedOption = roleField.options[roleField.selectedIndex];
                if (selectedOption && selectedOption.text) {
                    showRoleInfo(selectedOption.text);
                }
            }
        }
        
        function showRoleInfo(roleName) {
            // Remover alertas anteriores
            const existingAlert = document.querySelector('.role-info-alert');
            if (existingAlert) {
                existingAlert.remove();
            }
            
            // Informações sobre cada role
            const roleInfo = {
                'Administrador': {
                    class: 'alert-danger',
                    icon: 'bi-shield-exclamation',
                    text: 'Role com privilégios máximos. Use com extrema cautela.'
                },
                'Gerente': {
                    class: 'alert-warning',
                    icon: 'bi-shield-check',
                    text: 'Role de supervisão com acesso a relatórios gerenciais.'
                },
                'Usuário': {
                    class: 'alert-primary',
                    icon: 'bi-shield',
                    text: 'Role padrão para operações do dia a dia.'
                },
                'Visualizador': {
                    class: 'alert-secondary',
                    icon: 'bi-shield-slash',
                    text: 'Role com acesso somente leitura.'
                }
            };
            
            const info = roleInfo[roleName];
            if (info) {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert ${info.class} role-info-alert mt-3`;
                alertDiv.innerHTML = `
                    <i class="bi ${info.icon}"></i>
                    <strong>${roleName}:</strong> ${info.text}
                `;
                
                // Inserir após o campo de role
                roleField.closest('.form-group').appendChild(alertDiv);
            }
        }
        
        userField.addEventListener('change', validateCombination);
        roleField.addEventListener('change', validateCombination);
    }
});
</script>
{% endblock %}
