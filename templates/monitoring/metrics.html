{% extends 'base.html' %}

{% block title %}{{ title }} - FCM{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-graph-up"></i> {{ title }}</h1>
    <div class="btn-group">
        <button class="btn btn-primary" onclick="refreshMetrics()">
            <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
    </div>
</div>

<!-- Filtros -->
<div class="card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Conta</label>
                <select name="account" class="form-select">
                    <option value="">Todas as contas</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}" {% if account_filter == account.id|stringformat:"s" %}selected{% endif %}>
                            {{ account.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Métrica</label>
                <select name="metric" class="form-select">
                    <option value="">Todas as métricas</option>
                    {% for metric in available_metrics %}
                        <option value="{{ metric }}" {% if metric_filter == metric %}selected{% endif %}>
                            {{ metric }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Período</label>
                <select name="period" class="form-select">
                    <option value="1h" {% if period == '1h' %}selected{% endif %}>Última hora</option>
                    <option value="6h" {% if period == '6h' %}selected{% endif %}>Últimas 6 horas</option>
                    <option value="24h" {% if period == '24h' %}selected{% endif %}>Últimas 24 horas</option>
                    <option value="7d" {% if period == '7d' %}selected{% endif %}>Últimos 7 dias</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">&nbsp;</label>
                <div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a href="?" class="btn btn-secondary">
                        <i class="bi bi-x"></i> Limpar
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Gráficos de Métricas -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Gráficos de Métricas</h5>
            </div>
            <div class="card-body">
                {% if metrics_data != '{}' %}
                    <canvas id="metricsChart" width="400" height="200"></canvas>
                {% else %}
                    <div class="text-center py-5">
                        <i class="bi bi-graph-up display-1 text-muted"></i>
                        <h4 class="mt-3">Nenhuma métrica encontrada</h4>
                        <p class="text-muted">Ajuste os filtros ou colete métricas das suas contas AWS.</p>
                        <button class="btn btn-primary" onclick="collectMetrics()">
                            <i class="bi bi-arrow-clockwise"></i> Coletar Métricas
                        </button>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const metricsData = {{ metrics_data|safe }};
    
    if (Object.keys(metricsData).length > 0) {
        const ctx = document.getElementById('metricsChart').getContext('2d');
        
        const datasets = [];
        const colors = [
            'rgb(255, 99, 132)',
            'rgb(54, 162, 235)',
            'rgb(255, 205, 86)',
            'rgb(75, 192, 192)',
            'rgb(153, 102, 255)',
            'rgb(255, 159, 64)'
        ];
        
        let colorIndex = 0;
        
        for (const [metricName, data] of Object.entries(metricsData)) {
            datasets.push({
                label: metricName,
                data: data.map(point => ({
                    x: point.timestamp,
                    y: point.value
                })),
                borderColor: colors[colorIndex % colors.length],
                backgroundColor: colors[colorIndex % colors.length] + '20',
                tension: 0.1
            });
            colorIndex++;
        }
        
        new Chart(ctx, {
            type: 'line',
            data: {
                datasets: datasets
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            parser: 'YYYY-MM-DDTHH:mm:ss.SSSZ'
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    title: {
                        display: true,
                        text: 'Métricas AWS - {{ period|upper }}'
                    }
                }
            }
        });
    }
});

function refreshMetrics() {
    location.reload();
}

function collectMetrics() {
    alert('Funcionalidade de coleta de métricas será implementada em breve!');
}
</script>
{% endblock %}
