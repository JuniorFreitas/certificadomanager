{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - FCM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="bi bi-globe"></i> {{ title }}
                </h3>
            </div>
            <div class="card-body">
                <!-- Informações da conta -->
                <div class="alert alert-info" role="alert">
                    <h6 class="alert-heading"><i class="bi bi-info-circle"></i> Conta AWS</h6>
                    <p class="mb-1"><strong>Nome:</strong> {{ account.nome }}</p>
                    <p class="mb-0"><strong>Account ID:</strong> <code>{{ account.account_id }}</code></p>
                </div>

                <!-- Formulário -->
                <form method="post">
                    {% csrf_token %}
                    {% crispy form %}
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Botão Voltar -->
<div class="row mt-3">
    <div class="col-12">
        <a href="{% url 'accounts:detail' account.id %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar aos Detalhes
        </a>
    </div>
</div>
{% endblock %}
