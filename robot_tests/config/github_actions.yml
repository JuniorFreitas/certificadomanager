name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Executa testes diariamente às 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: certificatemanager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']
        browser: [chrome, firefox]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        
    - name: Install Chrome
      if: matrix.browser == 'chrome'
      uses: browser-actions/setup-chrome@latest
      
    - name: Install Firefox
      if: matrix.browser == 'firefox'
      uses: browser-actions/setup-firefox@latest
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd robot_tests
        pip install -r requirements.txt
    
    - name: Setup Django application
      run: |
        cp env.example .env
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py create_superuser_if_not_exists --username admin --email admin@test.com --password admin123
        python manage.py runserver 0.0.0.0:8000 &
        sleep 10  # Wait for server to start
      env:
        DJANGO_SETTINGS_MODULE: fcm.settings
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/certificatemanager_test
    
    - name: Run Smoke Tests
      run: |
        cd robot_tests
        robot -d results/smoke -i smoke -v BROWSER:${{ matrix.browser }} -v HEADLESS:True tests/
      continue-on-error: true
    
    - name: Run API Tests
      run: |
        cd robot_tests
        robot -d results/api -v BROWSER:${{ matrix.browser }} tests/api/
      continue-on-error: true
    
    - name: Run Web Tests
      run: |
        cd robot_tests
        robot -d results/web -i smoke -v BROWSER:${{ matrix.browser }} -v HEADLESS:True tests/web/
      continue-on-error: true
    
    - name: Run Integration Tests
      if: matrix.python-version == '3.10' && matrix.browser == 'chrome'
      run: |
        cd robot_tests
        robot -d results/integration -v BROWSER:${{ matrix.browser }} -v HEADLESS:True tests/integration/
      continue-on-error: true
    
    - name: Generate Combined Report
      if: always()
      run: |
        cd robot_tests
        rebot -d results/combined results/*/output.xml
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: robot-results-${{ matrix.python-version }}-${{ matrix.browser }}
        path: robot_tests/results/
        retention-days: 30
    
    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: robot_tests/results/combined/output.xml
        check_name: Robot Framework Tests (${{ matrix.python-version }}, ${{ matrix.browser }})
    
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request' && always()
      uses: joonvena/robotframework-reporter-action@v2.1
      with:
        gh_access_token: ${{ secrets.GITHUB_TOKEN }}
        report_path: robot_tests/results/combined

  regression-tests:
    runs-on: ubuntu-latest
    needs: robot-tests
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd robot_tests
        pip install -r requirements.txt
    
    - name: Setup Django application
      run: |
        cp env.example .env
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py runserver 0.0.0.0:8000 &
        sleep 10
    
    - name: Run Full Regression Tests
      run: |
        cd robot_tests
        robot -d results/regression -i regression -v BROWSER:headlesschrome tests/
    
    - name: Upload Regression Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: regression-test-results
        path: robot_tests/results/regression/
        retention-days: 60

  performance-tests:
    runs-on: ubuntu-latest
    needs: robot-tests
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd robot_tests
        pip install -r requirements.txt
        pip install pabot  # For parallel execution
    
    - name: Setup Django application
      run: |
        cp env.example .env
        python manage.py migrate
        python manage.py collectstatic --noinput
        python manage.py runserver 0.0.0.0:8000 &
        sleep 10
    
    - name: Run Performance Tests
      run: |
        cd robot_tests
        pabot -d results/performance -i slow --pabotlib tests/
    
    - name: Upload Performance Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: robot_tests/results/performance/
        retention-days: 30 